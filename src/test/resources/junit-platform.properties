cucumber.publish.quiet=true

# Parallel execution of scenarios on the JUnit Platform
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4

# Default selection: manual and work-in-progress scenarios never run automatically.
# Override from the command line: mvn test -Dcucumber.filter.tags="@smoke"
cucumber.filter.tags=not @manual and not @wip
