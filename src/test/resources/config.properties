# Shared configuration.
# Environment-specific values live in config-<env>.properties and are selected with -Denv:
#   mvn test -Denv=ci
# Any single value can also be overridden from the command line:
#   mvn test -Dbase.url=http://localhost:3001
base.url=https://restful-booker.herokuapp.com

# Public demo credentials published by Restful Booker.
admin.username=admin
admin.password=password123

# Endpoints
endpoint.auth=/auth
endpoint.booking=/booking

# Polling settings for asynchronous checks (seconds)
wait.timeout.seconds=10
wait.poll.seconds=1
